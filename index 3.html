  const r=await fetch(base+"/"+p+".json",o);if(!r.ok)throw new Error("Firebase "+r.status);return r.json()};
const root=p=>p.split("/")[0],poke=p=>{(L[root(p)]||[]).forEach(f=>f())};
const snapDoc=v=>({exists:v!==null&&v!==undefined,data:()=>(v===null?undefined:v)});
const colSnap=v=>({docs:Object.keys(v||{}).map(id=>({id,data:()=>v[id]}))});
function poll(path,make,every,cb){let last,stop=false;
  const run=async()=>{if(stop)return;try{const v=await J("GET",path),s=JSON.stringify(v);if(s!==last){last=s;cb(make(v))}}catch(e){}};
  run();const t=setInterval(run,every),r=root(path);(L[r]=L[r]||new Set()).add(run);
  return()=>{stop=true;clearInterval(t);L[r].delete(run)}}
let TREE=null,INIT=false,ES=null,STARTED=false;const WS=[];
const segs=p=>p.split("/").filter(Boolean);
function getp(path){let n=TREE;for(const k of segs(path)){if(n===null||typeof n!=="object"||!(k in n))return null;n=n[k]}return n===undefined?null:n}
function setp(p,v){const ks=segs(p);if(!ks.length){TREE=v;return}if(TREE===null||typeof TREE!=="object")TREE={};let n=TREE;
  for(let i=0;i<ks.length-1;i++){if(n[ks[i]]===null||typeof n[ks[i]]!=="object")n[ks[i]]={};n=n[ks[i]]}
  const k=ks[ks.length-1];if(v===null)delete n[k];else n[k]=v}
function fire(p){const a=segs(p);WS.forEach(w=>{const b=segs(w.path),m=Math.min(a.length,b.length);let ok=true;for(let i=0;i<m;i++)if(a[i]!==b[i]){ok=false;break}if(ok)w.cb(w.make(getp(w.path)))})}
function start(){if(STARTED)return;STARTED=true;
  const open=()=>{ES=new EventSource(base+"/.json");
    ES.addEventListener("put",e=>{const m=JSON.parse(e.data);setp(m.path,m.data);if(m.path==="/")INIT=true;fire(m.path)});
    ES.addEventListener("patch",e=>{const m=JSON.parse(e.data),b=m.path.replace(/\/$/,"");Object.keys(m.data||{}).forEach(k=>setp(b+"/"+k,m.data[k]));fire(m.path)});
    ES.addEventListener("cancel",()=>{ES.close();setTimeout(open,3000)});
    ES.onerror=()=>{if(ES.readyState===2)setTimeout(open,3000)}};
  open()}
function watch(path,make,every,cb){if(typeof EventSource==="undefined")return poll(path,make,every,cb);
  start();const w={path,make,cb};WS.push(w);if(INIT)cb(make(getp(path)));
  return()=>{const i=WS.indexOf(w);if(i>=0)WS.splice(i,1)}}
const db={
  doc:p=>({get:async()=>snapDoc(await J("GET",p)),set:async d=>{await J("PUT",p,d);poke(p)},update:async d=>{await J("PATCH",p,d);poke(p)},delete:async()=>{await J("DELETE",p);poke(p)},onSnapshot:cb=>watch(p,snapDoc,4000,cb)}),
  collection:n=>({add:async d=>{const r=await J("POST",n,d);poke(n);return{id:r.name}},onSnapshot:cb=>watch(n,colSnap,n==="cards"?60000:4000,cb)})};

<script>

function cardHTML(c,n,isNew){
  const rr=c.rs!==undefined?c.rs:rar(c),[rn,col]=RAR[rr];
  const ph=c.photo&&c.photo.startsWith("data:image/")?`style="background-image:url(${c.photo})"`:"";

function draw(){
  const w=WEIGHTS;let r=0,x=Math.random()*100;
  for(;r<4&&x>=w[r];r++)x-=w[r];
  const all=[...cards.values()];
  let pool=[];for(let k=r;k>=0&&!pool.length;k--)pool=all.filter(c=>rar(c)===k);if(!pool.length)pool=all;
  return pool[Math.floor(Math.random()*pool.length)];
}
async function changeInv(u,c,d){
  const ref=db.doc("inventory/"+iid(u,c)),s=await ref.get(),n=(s.data()?.n||0)+d;
  if(n<=0)await ref.delete();else await ref.set({uid:u,cardId:c,n,ts:d>0?Date.now():((s.data()&&s.data().ts)||0)});
}
async function openPack(){
  if(avail()<1||document.getElementById("opn"))return;
  if(!cards.size){msg="Aucune carte dans le set. Crée la première dans l'onglet « Cartes ».";return render()}
  const picks=Array.from({length:5},draw),seen=new Set();
  seq=picks.map(c=>{const isNew=own(me,c.id)===0&&!seen.has(c.id);seen.add(c.id);return{c,isNew,up:false}});
  {const a=avail(),now=Date.now();pk={stock:a-1,ts:a>=MAXP?now:pk.ts+Math.max(0,Math.floor((now-pk.ts)/COOL))*COOL};db.doc("players/"+safe(me)).set(pk).catch(()=>{})}
  msg="";render();openSeq();
  const cnt={};picks.forEach(c=>cnt[c.id]=(cnt[c.id]||0)+1);
  window._q=(window._q||Promise.resolve()).then(async()=>{try{for(const id in cnt)await changeInv(me,id,cnt[id])}catch(e){msg="Erreur d'enregistrement : "+(e.message||e);render()}});
}
function shrink(file){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
    const W=280,H=350,cv=document.createElement("canvas");cv.width=W;cv.height=H;
    const k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;
    cv.getContext("2d").drawImage(i,(W-w)/2,(H-h)/2,w,h);res(cv.toDataURL("image/jpeg",.72))};
    i.onerror=()=>res("");i.src=r.result};r.onerror=()=>res("");r.readAsDataURL(file)})}

    const others=open.filter(t=>t.from!==me).sort((a,b)=>(own(me,a.give)?1:0)-(own(me,b.give)?1:0)||(own(me,b.want)>0?1:0)-(own(me,a.want)>0?1:0)),mineT=open.filter(t=>t.from===me);

    <label>Je veux<select id="wv">${all.map(c=>`<option value="${esc(c.id)}">#${pad(c.num)} ${esc(c.name)}</option>`).join("")||"<option value=''>— aucune carte —</option>"}</select></label></div>

function achGrid(u){return `<div class="agrid">${ACH.map(a=>`<div class="ach ${achs.has(safe(u)+"_"+a[0])?"ok":""}"><span class="ai">${a[1]}</span><b>${a[2]}</b><small>${a[3]}</small></div>`).join("")}</div>`}
function achView(){const g=ACH.filter(a=>achs.has(safe(me)+"_"+a[0])).length;
  document.getElementById("m").innerHTML=`<div class="box"><h2 style="margin:0 0 6px">🏅 Succès</h2><p class="mut" style="margin:0">${g}/${ACH.length} débloqués. Chaque succès n'est gagné qu'une seule fois.</p></div>`+achGrid(me)}
function ensureNames(ids){const m=ids.filter(u=>u&&!(u in names));if(!m.length||!user)return;
  user.profiles(m).then(r=>{m.forEach(u=>names[u]=(r[u]&&r[u].name)||"Un ami");sched()}).catch(()=>{m.forEach(u=>names[u]="Un ami")})}
function profileView(){const u=pfU||me,s=pstats(u),nm=names[u]||(u===me?"Moi":"Un ami"),got=ACH.filter(a=>achs.has(safe(u)+"_"+a[0])).length;
  const top=s.c.slice().sort((a,b)=>rar(b)-rar(a)||a.num-b.num).slice(0,3);
  document.getElementById("m").innerHTML=`<div class="box pfh"><div class="av2">${esc((nm[0]||"?").toUpperCase())}</div><div><h2 style="margin:0">${esc(nm)}${u===me?" (toi)":""}</h2><div class="mut">Niv. ${s.lv} · ${s.xp} XP · ${got}/${ACH.length} succès</div></div></div>
  <div class="dash"><div class="box"><div class="mut">Niveau ${s.lv}</div><div class="pb"><i style="width:${s.lx*100/s.ln}%"></i></div><p class="mut" style="margin:6px 0 0">${s.lx}/${s.ln} XP</p></div><div class="box"><div class="mut">Collection</div><div class="stat">${s.pct} %</div><div class="pb"><i style="width:${s.pct}%"></i></div><p class="mut" style="margin:6px 0 0">${s.got}/${cards.size} cartes · ${s.dups} doublons · ${s.tr} échange(s)</p></div></div>
  <div class="box"><div class="chips">${RAR.map((r,i)=>`<span class="chip" style="border-color:${r[1]};color:${r[1]}">${r[0]} ${s.rr[i]}</span>`).join("")}</div></div>
  <h3 class="rh" style="--c:var(--acc2)">Vitrine</h3>${top.length?`<div class="mini">${top.map(c=>cardHTML(c,1)).join("")}</div>`:`<p class="mut">Aucune carte pour l'instant.</p>`}
  <h3 class="rh" style="--c:var(--acc)">Succès</h3>${achGrid(u)}`;
  ensureNames([u])}
function tradeExtra(){if(tab!=="trade"||document.getElementById("hist"))return;
  const dup=[...cards.values()].filter(c=>own(me,c.id)>1).sort((a,b)=>a.num-b.num);
  const h=[...trades.values()].filter(t=>t.status==="done"&&(t.from===me||t.to===me)).sort((a,b)=>b.ts-a.ts).slice(0,10);
  const nm=u=>u===me?"Toi":(names[u]||"Un ami"),cn=id=>{const c=cards.get(id);return c?`#${pad(c.num)} ${esc(c.name)}`:"carte supprimée"};
  const d=document.createElement("div");d.id="hist";
  d.innerHTML=`<div class="box"><h3 style="margin-top:0">Mes doublons (à échanger)</h3>${dup.length?`<div class="chips">${dup.map(c=>`<span class="chip">${cn(c.id)} ×${own(me,c.id)}</span>`).join("")}</div>`:`<span class="mut">Aucun doublon pour l'instant.</span>`}</div>
  <div class="box"><h3 style="margin-top:0">Historique de mes échanges</h3>${h.length?h.map(t=>`<div class="it"><span>${nm(t.from)} ↔ ${nm(t.to)}</span><span class="mut">${cn(t.give)} contre ${cn(t.want)}</span></div>`).join(""):`<span class="mut">Aucun échange terminé.</span>`}</div>`;
  document.getElementById("m").appendChild(d)}
function navBadge(){const n=[...trades.values()].filter(t=>t.status==="open"&&t.from!==me&&own(me,t.want)>0&&cards.get(t.give)).length,b=document.querySelector('[data-t="trade"]');
  if(b&&n>0)b.insertAdjacentHTML("beforeend",`<span class="bdg">${n}</span>`)}
document.addEventListener("click",e=>{const r=e.target.closest&&e.target.closest("[data-pf]");if(r){pfU=r.dataset.pf;tab="profile";render();return}
  const n=e.target.closest&&e.target.closest('[data-t="profile"]');if(n){pfU=null;render()}});
let acct=null,unP=null;const plist=new Map();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function subPlayer(){if(unP){try{unP()}catch(e){}unP=null}const my=me;pk={stock:0,ts:Date.now()};
  const u=db.doc("players/"+safe(my)).onSnapshot(s=>{if(my!==me)return;const d=s.data();if(!d||d.stock===undefined){pk={stock:3,ts:Date.now()};db.doc("players/"+safe(my)).set(pk).catch(()=>{})}else pk={stock:d.stock,ts:d.ts};tick()});
  if(typeof u==="function")unP=u}
function ensurePbtn(){const a=document.querySelector("aside");if(!a||!db||!me)return;let b=document.getElementById("pbtn");
  if(!b){b=document.createElement("button");b.id="pbtn";b.className="pbtn";a.appendChild(b)}
  b.innerHTML=`<span class="ic">👤</span><span class="lb">${esc(names[me]||"Moi")} ⇄</span>`}
function pickView(){let d=document.getElementById("pick");if(!d){d=document.createElement("div");d.id="pick";document.body.appendChild(d)}
  d.innerHTML=`<div class="box pkb"><h3 style="margin-top:0">Qui joue ?</h3><div class="pl">${[...plist.values()].map(p=>`<button class="chip ${p.id===me?"on":""}" data-pp="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div><p class="mut">Chaque joueur a sa collection, ses boosters et sa place au classement.</p><div class="row"><input id="pnm" placeholder="Prénom du nouveau joueur" maxlength="20"><button class="pri" id="padd">Ajouter</button></div><button id="pclose" style="margin-top:12px">Fermer</button></div>`}
document.addEventListener("click",async e=>{const t=e.target.closest&&e.target.closest("#pbtn,[data-pp],#padd,#pclose");if(!t||!db)return;
  const close=()=>{const d=document.getElementById("pick");if(d)d.remove()};
  if(t.id==="pbtn")pickView();else if(t.id==="pclose")close();
  else if(t.dataset.pp){me=t.dataset.pp;ls("wk-me",me);close();subPlayer();pfU=null;render()}
  else if(t.id==="padd"){const n=document.getElementById("pnm").value.trim().slice(0,20);if(!n)return;
    const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    try{await db.doc("profiles/"+id).set({name:n});names[id]=n;plist.set(id,{id,name:n});me=id;ls("wk-me",id);close();subPlayer();pfU=null;render()}catch(er){alert("Erreur : "+(er.message||er))}}});
const _r=render;render=function(){_r();tick();fillDraft();if(tab==="home"&&db&&me)homeView();if(tab==="rank"&&db&&me)rankView();if(tab==="ach"&&db&&me)achView();if(tab==="profile"&&db&&me)profileView();if(db&&me){checkAch();navBadge();ensurePbtn()}if(tab==="trade")tradeExtra();if(tab==="coll"&&db&&me)collView();if(tab==="packs"){afterFlip();oddsBox()}};
render();
</script>
</body>
</html>
